# Mission 16 (partie 6) : à chaque push sur main (chaque déploiement Vercel) et à chaque pull request.
# Lint, tests, build, puis le site construit est démarré (port 3100) et mesuré : Lighthouse CI sur les six pages
# (mobile, seuils de lighthouserc.json : un seuil manqué fait ÉCHOUER le job), captures 375 / 768 / 1440 comparées à
# la dernière exécution réussie sur main (information seulement, jamais un échec). Aucun secret : le site lit les
# routes publiques du CRM de production et n'y écrit rien (NEXT_PUBLIC_SANS_EVENEMENTS). Lire : docs/SUIVI.md § 11.
name: Site — lint, tests, Lighthouse, captures
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SIMULATE_URL: https://crm.coverswap.fr/api/simulate
      NEXT_PUBLIC_SANS_EVENEMENTS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Démarrer le site construit (port 3100)
        id: serveur
        run: |
          npx next start -p 3100 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3100/; then echo "Site prêt après ${i} s."; exit 0; fi
            sleep 1
          done
          cat next-start.log
          exit 1

      # Lighthouse CI : collecte (2 passages par page), rapports dans lhci/ (publiés même en cas d'échec), puis les seuils.
      - name: Lighthouse — mesure des six pages (mobile)
        run: npx lhci collect --config=lighthouserc.json
      - name: Lighthouse — rapports
        if: ${{ !cancelled() && steps.serveur.outcome == 'success' }}
        run: npx lhci upload --config=lighthouserc.json
      - name: Lighthouse — seuils (≥ 0,95 sur les quatre axes, LCP ≤ 2 s, CLS ≤ 0,05, TBT ≤ 200 ms)
        run: npx lhci assert --config=lighthouserc.json
      - name: Publier les rapports Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lhci/
          if-no-files-found: ignore

      # Captures : même si Lighthouse a échoué (elles aident à comprendre pourquoi).
      - name: Chromium pour les captures
        if: ${{ !cancelled() && steps.serveur.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Captures 375 / 768 / 1440
        id: captures
        if: ${{ !cancelled() && steps.serveur.outcome == 'success' }}
        run: npm run captures
      - name: Captures de référence (dernière exécution réussie sur main)
        if: ${{ !cancelled() && steps.captures.outcome == 'success' }}
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: site.yml
          branch: main
          workflow_conclusion: success
          name: captures
          search_artifacts: true
          path: captures-precedentes
          if_no_artifact_found: warn
      - name: Comparaison (information, jamais un échec)
        if: ${{ !cancelled() && steps.captures.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/comparer-captures.mjs captures-precedentes captures
      - name: Publier les captures
        if: ${{ !cancelled() && steps.captures.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: captures/
          if-no-files-found: ignore
